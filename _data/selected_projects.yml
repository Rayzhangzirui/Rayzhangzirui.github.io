# Selected projects shown on the homepage (thumbnail left, description right)

- title: "Bilevel Local Operator Learning for PDE Inverse Problems"
  description: " Many scientific models contain unknown parameters that must be inferred from data. We develop a neural-network-based method that identifies the best parameters while respecting the underlying model, using a two-level optimization scheme.
  Try the interactive [Physics-Informed Machine Learning Playground](https://rayzhangzirui.github.io/physics-informed-playground/) to explore PINNs and BiLO on simple ODEs."
  url: "https://rayzhangzirui.github.io/physics-informed-playground/"
  media_type: "image"
  media_path: "assets/img/playground_snapshot.png"
  citation: "**BiLO: Bilevel Local Operator Learning for PDE Inverse Problems.** Ray Zirui Zhang, Christopher E. Miles, Xiaohui Xie, John S. Lowengrub. *Journal of Computational Physics*, 2026."

- title: "Personalized Predictions of Glioblastoma Infiltration"
  description: "Brain tumors, such as glioblastomas, often grow invisibly beyond what standard MRI scans can show. While this hidden infiltration can't be fully measured, it follows physical laws of growth and diffusion that can be modeled using partial differential equations (PDEs). By combining these mathematical models with machine learning, we aim to make personalized predictions of tumor spread, paving the way for highly targeted and effective treatment planning."
  media_type: "video"
  media_path: "assets/video/movie_growth_rotate.mp4"
  citation: "**Personalized Predictions of Glioblastoma Infiltration: Mathematical Models, Physics-Informed Neural Networks and Multimodal Scans.** Ray Zirui Zhang, Ivan Ezhov, Michal Balcerak, Andy Zhu, Benedikt Wiestler, Bjoern Menze, John S. Lowengrub. *Medical Image Analysis*, 2025."

- title: "Binary Level Set Method"
  description: "Mathematically, a surface is simply a boundary that separates the \"inside\" from the \"outside.\" By intelligently flipping grid points between these two states (hence, \"binary\"), we can efficiently compute optimal surfaces. We use this algorithm to study the interface between water and a protein, which affect the binding process"
  media_type: "image"
  media_path: "assets/img/fig_bvism_loose_bubble.png"
  citation: "**Binary Level Set Method for Variational Implicit Solvation Model.** Ray Zirui Zhang, Li-Tien Cheng. *SIAM Journal on Scientific Computing*, 2023."
